name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    name: Rust core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test numerical crates
        run: cargo test --workspace --exclude separatrix --release
      - name: Formatting
        if: matrix.os == 'ubuntu-22.04'
        run: cargo fmt --all -- --check
      - name: Clippy
        if: matrix.os == 'ubuntu-22.04'
        run: cargo clippy --workspace --exclude separatrix --all-targets -- -D warnings

  app:
    name: App build check (Linux)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Frontend
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Tauri crate
        run: cargo build -p separatrix
      - name: IPC TypeScript bindings are up to date
        run: cargo test -p separatrix --lib typescript_bindings_are_up_to_date
      - name: Versions agree and suit MSI
        run: cargo test -p separatrix --test version
      - name: Release readiness (without the numerical gates, which the core job runs)
        run: bash scripts/release-check.sh --skip-gates

  site:
    name: Website build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build the website (fails on a broken docs link, anchor or image)
        working-directory: site
        run: |
          npm ci
          node build.mjs
