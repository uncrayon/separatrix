[package]
name = "separatrix"
description = "Desktop app for exploring dynamical systems"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "separatrix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "~2.12", features = [] }
serde.workspace = true
serde_json.workspace = true
dyn-core.workspace = true
dyn-expr.workspace = true
dyn-solve.workspace = true
dyn-analysis.workspace = true
separatrix-project.workspace = true
separatrix-export.workspace = true
# Exact pins: the newest patches are under two weeks old (see docs/contracts.md).
tauri-plugin-dialog = "=2.8.3"
tauri-plugin-single-instance = "=2.5.4"
tauri-plugin-clipboard-manager = "=2.5.0"
tauri-plugin-updater = "=2.14.0"

[dev-dependencies]
ts-rs.workspace = true
# The bindings test needs the TypeScript declarations of the maths crates' types.
dyn-core = { workspace = true, features = ["ts"] }
dyn-expr = { workspace = true, features = ["ts"] }
dyn-solve = { workspace = true, features = ["ts"] }
dyn-analysis = { workspace = true, features = ["ts"] }
separatrix-project = { workspace = true, features = ["ts"] }
