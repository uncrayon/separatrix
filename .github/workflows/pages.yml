name: Website

# Builds site/ (which renders docs/ and copies the design system) and publishes it to
# GitHub Pages. The repository owner turns Pages on once: Settings, Pages, Source:
# GitHub Actions. This workflow does not try to enable it.
on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/**"
      - "app/src/styles/ds/**"
      - "app/src/templates/templates.json"
      - "app/package.json"
      - "scripts/release/assets.txt"
      - "LICENSE"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Build
        working-directory: site
        run: |
          npm ci
          node build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
