name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    name: Bundle (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            runner: ubuntu-22.04
            os: linux
            arch: x86_64
            variant: ''
            args: --bundles deb,rpm,appimage
          - name: windows
            runner: windows-latest
            os: windows
            arch: x64
            variant: ''
            args: --bundles nsis,msi
          - name: windows-offline
            runner: windows-latest
            os: windows
            arch: x64
            variant: offline
            args: >-
              --bundles nsis
              --config '{"bundle":{"windows":{"webviewInstallMode":{"type":"offlineInstaller"}}}}'
          - name: macos
            runner: macos-latest
            os: macos
            arch: universal
            variant: ''
            args: --target universal-apple-darwin --bundles app,dmg
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Updater key is configured
        run: |
          pubkey=$(node -p 'require("./app/src-tauri/tauri.conf.json").plugins?.updater?.pubkey ?? ""')
          artifacts=$(node -p 'require("./app/src-tauri/tauri.conf.json").bundle?.createUpdaterArtifacts ?? false')
          if [ -n "$pubkey" ] && [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::tauri.conf.json has an updater pubkey, but the TAURI_SIGNING_PRIVATE_KEY secret is empty. See docs/updater.md."
            exit 1
          fi
          if [ -n "$pubkey" ] && [ "$artifacts" != true ]; then
            echo "::error::tauri.conf.json has an updater pubkey, but bundle.createUpdaterArtifacts is $artifacts, not true, so no update would be signed. See docs/updater.md."
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Linux system dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Install frontend dependencies
        working-directory: app
        run: npm ci
      - name: Build the installers
        working-directory: app
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: npx tauri build ${{ matrix.args }}
      - name: Name the installers
        run: bash scripts/release/assets.sh release-assets "${{ matrix.os }}" "${{ matrix.arch }}" "${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        with:
          name: bundle-${{ matrix.name }}
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Draft release
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: bundle-*
          merge-multiple: true
      - name: Version and tag agree
        id: version
        run: |
          version=$(bash scripts/release/assets.sh --version)
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::The pushed tag is $GITHUB_REF_NAME, but Cargo.toml says $version. Tag v$version instead."
            exit 1
          fi
          echo "version=$version" >>"$GITHUB_OUTPUT"
      - name: Checksums and updater feed
        run: |
          bash scripts/release/manifest.sh release-assets "${{ steps.version.outputs.version }}" "$GITHUB_REPOSITORY"
          cat release-assets/SHA256SUMS.txt
      - name: Create or refresh the draft release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          tag="v$VERSION"
          blob="https://github.com/$GITHUB_REPOSITORY/blob/$tag"
          cat >notes.md <<EOF
          Separatrix $VERSION. Install guides for [Windows]($blob/docs/install/windows.md), [macOS]($blob/docs/install/macos.md) and [Linux]($blob/docs/install/linux.md).

          On Windows, \`Separatrix_${VERSION}_windows_x64-setup.exe\` downloads WebView2 if the PC lacks it. \`Separatrix_${VERSION}_windows_x64_offline-setup.exe\` carries WebView2 for a PC with no internet.

          Check a download against \`SHA256SUMS.txt\` before you open it. The install guides show how.
          EOF
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != true ]; then
              echo "::error::Release $tag is already published. Bump the version to release again."
              exit 1
            fi
            gh release edit "$tag" --notes-file notes.md
            gh release upload "$tag" release-assets/* --clobber
          else
            gh release create "$tag" release-assets/* --draft --target "$GITHUB_SHA" \
              --title "Separatrix $VERSION" --notes-file notes.md
          fi
